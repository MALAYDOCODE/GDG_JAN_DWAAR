<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Submitted | Jan Dwaar</title>

    <link rel="stylesheet" href="sub.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>
    <div class="overlay"></div>


    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="top-bar">

        <div class="brand">

            <img src="logo (2).png" alt="Jan Dwaar Logo">

            <div>
                <h2>JAN DWAAR</h2>
                <span>Community Development Platform</span>
            </div>

        </div>

    </header>


    <main class="success-page">

        <div class="success-card">

            <!-- Success Icon -->

            <div class="success-icon">
                ✓
            </div>


            <!-- Heading -->

            <p class="eyebrow">
                REPORT RECEIVED
            </p>

            <h1>
                Thank you for<br>
                speaking up.
            </h1>

            <p class="message">
                Your community report has been successfully submitted.
                It will be processed and analysed to help identify
                the issues that need attention.
            </p>


            <!-- Status -->

            <div class="status">

                <div class="status-dot"></div>

                <div>
                    <strong>Report submitted</strong>

                    <p>
                        Your report is now in the system.
                    </p>
                </div>

            </div>


            <!-- Actions -->

            <div class="actions">

                <button
                    class="primary-button"
                    onclick="goHome()"
                >
                <a href="index.html" class="bibi">
                    Back to Home</a>
                </button>

                <button
                    class="secondary-button"
                    onclick="reportAnother()"
                ><a href="report.html" class="baba">
                    Report Another Problem</a>
                </button>

            </div>

        </div>

    </main>


    <script src="sub.js"></script>

</body>

</html>
